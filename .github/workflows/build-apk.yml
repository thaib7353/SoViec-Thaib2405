name: Build Sổ Việc Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép kích hoạt thủ công trên giao diện GitHub Actions

jobs:
  build-apk:
    name: Biên dịch file APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Thiết lập Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Thiết lập Android SDK & Chấp nhận giấy phép
        uses: android-actions/setup-android@v3

      - name: 5. Cài đặt các thư viện npm
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 6. Biên dịch mã nguồn Web (React + Vite)
        run: npm run build

      - name: 7. Đồng bộ mã nguồn web sang dự án Android
        run: npx cap sync android

      - name: 8. Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 9. Thiết lập bộ đệm Gradle (Tăng tốc độ build)
        uses: gradle/actions/setup-gradle@v4

      - name: 10. Biên dịch Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 11. Đính kèm file APK vào Artifacts để tải về
        uses: actions/upload-artifact@v4
        with:
          name: SoViec-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
