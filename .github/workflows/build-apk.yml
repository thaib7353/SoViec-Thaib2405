name: Build Sổ Việc Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép kích hoạt thủ công trên giao diện GitHub Actions
    inputs:
      confirm_licenses:
        description: 'Xác nhận đồng ý Điều khoản Giấy phép Google Android SDK (android-sdk-license)'
        required: true
        type: boolean
        default: true

jobs:
  build-apk:
    name: Biên dịch file APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Thiết lập Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Thiết lập Android SDK (Chỉ cài đặt các gói cần thiết)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: 5. Đảm bảo giấy phép Android SDK được chấp thuận (Môi trường CI không tương tác)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          # Ghi nhận chữ ký số giấy phép chính thức Google Android SDK (android-sdk-license)
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          # Chấp thuận không tương tác tự động cho tất cả gói phụ thuộc, tránh dừng chờ nhập y/N
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: 6. Cài đặt các thư viện npm
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 7. Biên dịch mã nguồn Web (React + Vite)
        run: npm run build

      - name: 8. Đồng bộ mã nguồn web sang dự án Android
        run: npx cap sync android

      - name: 9. Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 10. Thiết lập bộ đệm Gradle (Tăng tốc độ build)
        uses: gradle/actions/setup-gradle@v4

      - name: 11. Biên dịch Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 12. Đính kèm file APK vào Artifacts để tải về
        uses: actions/upload-artifact@v4
        with:
          name: SoViec-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
